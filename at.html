<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111">
<title>새로 그린 악보 · 모두의 밴드</title>
<style>
:root{--bg:#fff;--fg:#111}
body{margin:0;overflow-x:hidden;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#bar{position:sticky;top:0;background:#111;color:#fff;padding:8px max(10px,env(safe-area-inset-left));z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar button{font-size:17px;padding:7px 14px;border:0;border-radius:10px;background:#2b2b2b;color:#fff}
#bar button.on{background:#dc2626}#bar b{font-size:15px}#pt{font-size:16px;padding:6px;border-radius:10px;background:#2b2b2b;color:#fff;border:0}#pt:empty{display:none}#st{font-size:13px;opacity:.75}
#at{padding:0 6px}
#yt{display:none;background:#000;position:sticky;top:52px;z-index:8}#yt.on{display:flex;gap:8px;align-items:center;padding:6px;flex-wrap:wrap}
#ytbox{width:min(320px,45vw);aspect-ratio:16/9}#ytbox iframe{width:100%;height:100%}
#ytc{color:#fff;font-size:14px;display:flex;flex-direction:column;gap:6px}#ytc button{font-size:15px;padding:6px 10px;border:0;border-radius:8px;background:#333;color:#fff}
#ytc .tap{background:#2563eb;font-size:16px}#ytc small{opacity:.75}@media(max-height:500px){#ytbox{width:190px}#ytc small{display:none}}
.at-cursor-bar{background:#fde68a55}.at-cursor-beat{background:#dc2626;width:3px}
.at-highlight *{fill:#dc2626;stroke:#dc2626}
</style>
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script></head><body>
<div id="bar"><button id="p">▶ 재생</button><button id="h">⏮</button><button id="dn">−</button><b id="sp">100%</b><button id="up">+</button><button id="mt">🔇 소리</button><button id="ytb">📺 원곡</button><select id="pt"></select><button id="fs" title="꽉 찬 화면">⛶</button><span id="st">불러오는 중…</span></div>
<div id="yt"><div id="ytbox"><div id="ytp"></div></div><div id="ytc">
 <button class="tap" id="tap">🎯 지금이 <b id="mk">16</b>마디 첫 박!</button>
 <div><button id="o1">◀ 0.05초</button> <button id="o2">0.05초 ▶</button></div><small id="yinfo">원곡을 틀고, 기타가 들어오는 순간 🎯를 누르면 악보가 원곡에 맞춰져요</small></div></div>
<div id="at"></div>
<script>
// 새로 그린 악보(alphaTex) — 음표 하나하나에 박자가 들어 있어 커서가 정확히 따라감(10/25 사용자 «너가 악보를 새로 그리는 게 정확하겠다»)
// 구매 악보를 옮긴 것이라 저장소엔 넣지 않고 방 악보함(band_play_lib/{키}/tex)에서 읽는다
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
// 아이폰: 무음 스위치가 켜져 있으면 웹오디오(악보 소리)가 안 남 → 오디오 세션을 «재생»으로 바꾸고, 첫 터치에 무음 오디오를 틀어 풀어 줌
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let unl=false;const unlock=()=>{if(unl)return;unl=true;try{const au=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');au.loop=true;au.volume=0.01;au.play().catch(()=>{})}catch(e){}
 try{const c=api&&api.player&&api.player.output&&api.player.output.context;if(c&&c.resume)c.resume()}catch(e){}};
['touchend','click'].forEach(t=>document.addEventListener(t,unlock,{capture:true}));
let api=null;
const DB='https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app/band_play_lib/';
// 같은 곡의 다른 파트(곡_파트 이름)를 골라 보기 — 원곡 기준점은 곡 단위로 공유
const SONG=(q.get('s')||'').split('_')[0],PN={g1:'🎸 기타1',g2:'🎸 기타2',bass:'🎸 베이스',keys:'🎹 키보드',drums:'🥁 드럼'};
fetch(DB+q.get('k')+'/tex.json?shallow=true').then(r=>r.json()).then(o=>{const ks=Object.keys(o||{}).filter(k=>k.split('_')[0]===SONG);if(ks.length<2)return;
 const order=Object.keys(PN);ks.sort((a,b)=>order.indexOf(a.split('_')[1])-order.indexOf(b.split('_')[1]));
 $('pt').innerHTML=ks.map(k=>`<option value="${k}"${k===q.get('s')?' selected':''}>${PN[k.split('_')[1]]||k}</option>`).join('');
 $('pt').onchange=()=>{q.set('s',$('pt').value);location.search=q.toString()}}).catch(()=>{});
const CDN='https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/';
fetch(DB+q.get('k')+'/tex/'+q.get('s')+'.json').then(r=>r.json()).then(tex=>{
 if(!tex){$('st').textContent='악보를 못 찾았어요';return}
 const narrow=innerWidth<700;
 api=new alphaTab.AlphaTabApi($('at'),{core:{fontDirectory:CDN+'font/',tex:true},
  display:{staveProfile:q.get('v')||({g1:'Tab',g2:'ScoreTab',bass:'ScoreTab',keys:'Score',drums:'Score'})[(q.get('s')||'').split('_')[1]]||'Tab',scale:narrow?0.95:1.15,layoutMode:'page'},
  notation:{rhythmMode:alphaTab.TabRhythmMode.ShowWithBars},
  player:{enablePlayer:true,enableCursor:true,enableAnimatedBeatCursor:true,soundFont:CDN+'soundfont/sonivox.sf2',scrollElement:document.scrollingElement,scrollOffsetY:-90}});
 window.api=api;let mute=false,sp=1;api.masterVolume=1;$('mt').textContent='🔊 소리';
 api.error.on(e=>{$('st').textContent='오류: '+(e.message||e)});
 api.renderFinished.on(()=>{$('st').textContent='';window.__done=1});
 let ready=false;api.soundFontLoad.on(e=>{if(!ready)$('st').textContent='소리 준비 '+Math.floor(e.loaded/e.total*100)+'%'});
 api.playerReady.on(()=>{ready=true;$('st').textContent=''});
 api.playerStateChanged.on(e=>{const on=e.state===1;$('p').textContent=on?'⏸ 멈춤':'▶ 재생';$('p').classList.toggle('on',on)});
 api.tex(tex);
 $('p').onclick=()=>api.playPause();$('h').onclick=()=>api.stop();
 const S=d=>{sp=Math.max(0.5,Math.min(1.5,Math.round((sp+d)*20)/20));api.playbackSpeed=sp;$('sp').textContent=Math.round(sp*100)+'%'};
 $('dn').onclick=()=>S(-0.05);$('up').onclick=()=>S(0.05);
 $('mt').onclick=()=>{mute=!mute;api.masterVolume=mute?0:1;$('mt').textContent=mute?'🔇 소리':'🔊 소리'};

 // ── 원곡(유튜브) 맞춰 틀기: 악보 커서가 영상 시간을 따라감. 기준점(🎯)은 곡마다 이 기기에 저장(10/25 «대표 음원 하나 맞춰 틀어 놓고»)
 const YT_ID=q.get('yt')||'1cMKPc3Yors',MARK=+(q.get('mark')||16),OK='at_off_'+SONG;
 $('mk').textContent=MARK;let yp=null,off=null,sync=0;try{const v=localStorage.getItem(OK)??localStorage.getItem('at_off_'+q.get('s'));if(v!=null)off=+v}catch(e){}
 const barMs=n=>{let t=0;const mb=api.score.masterBars;for(let i=0;i<n-1;i++){const m=mb[i];t+=m.calculateDuration()*60000/960/(api.score.tempo)}return t}; // 앞 마디들 길이(반복 없는 첫 회)
 const info=()=>$('yinfo').textContent=off==null?'원곡을 틀고, 기타가 들어오는 순간 🎯를 누르면 악보가 원곡에 맞춰져요':`맞춤 완료 (영상 ${off.toFixed(2)}초 = 1마디). 영상을 움직이면 악보가 따라가요`;
 function follow(){if(!yp||off==null||!yp.getCurrentTime)return;const st=yp.getPlayerState(),want=(yp.getCurrentTime()-off)*1000;
  api.playbackSpeed=yp.getPlaybackRate();
  if(st===1){if(api.playerState!==1)api.play();if(want>=0&&Math.abs(api.timePosition-want)>90)api.timePosition=want}
  else{if(api.playerState===1)api.pause();if(want>=0&&Math.abs(api.timePosition-want)>30)api.timePosition=want}}
 $('ytb').onclick=()=>{const on=$('yt').classList.toggle('on');$('ytb').classList.toggle('on',on);
  if(on&&!yp){mute=true;api.masterVolume=0;$('mt').textContent='🔇 소리';
   const go=()=>{yp=new YT.Player('ytp',{videoId:YT_ID,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{sync=setInterval(follow,200)}}})};
   if(window.YT&&YT.Player)go();else{window.onYouTubeIframeAPIReady=go;const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)}}
  if(!on&&yp){yp.pauseVideo()}info()};
 $('tap').onclick=()=>{if(!yp||!yp.getCurrentTime)return;off=yp.getCurrentTime()-barMs(MARK)/1000;try{localStorage.setItem(OK,off)}catch(e){}info();follow()};
 $('o1').onclick=()=>{if(off==null)return;off-=0.05;try{localStorage.setItem(OK,off)}catch(e){}info()};
 $('o2').onclick=()=>{if(off==null)return;off+=0.05;try{localStorage.setItem(OK,off)}catch(e){}info()};
}).catch(e=>{$('st').textContent='불러오기 실패'});
</script><script>
document.getElementById('fs').onclick=()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
 else{const e=d.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)f.call(e);else document.getElementById('st').textContent=('사파리 공유 버튼 → 「홈 화면에 추가」로 열면 주소창 없이 꽉 찬 화면이 돼요')}};
</script></body></html>
