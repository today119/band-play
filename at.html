{const mq=matchMedia('(max-height:500px)'),mp=document.getElementById('mp'),mb=document.getElementById('more');
 const items=['.tempo','#mt','#cm','#ex','#ytb','#rec'].map(q=>document.querySelector(q)).filter(Boolean),home=items.map(e=>{const m=document.createComment('');e.before(m);return m});
 const bar=document.getElementById('bar'),put=()=>{if(mq.matches&&!bar.classList.contains('x2'))items.forEach(e=>mp.appendChild(e));else{items.forEach((e,i)=>home[i].after(e));mp.classList.remove('on')}};
 // 폰 가로 3단계(10/27 «내리기로 2줄, 올리기로 1줄, 더 올리면 악보만+내리기 조금, 화면 세 번 = 1줄»): 2줄 ⇄ 1줄 ⇄ 악보만
 const x2=v=>{bar.classList.toggle('x2',v);put()};
 window.__x2Down=()=>{if(mq.matches&&bar.classList.contains('x2')){x2(false);return true}return false}; // 2줄 → 1줄
 window.__x2Up=()=>{if(mq.matches&&!bar.classList.contains('x2')&&!document.body.classList.contains('bh')){x2(true);return true}return false}; // 1줄 → 2줄
 window.__x2Off=()=>{if(bar.classList.contains('x2'))x2(false)};
 {const hb=document.getElementById('hideb'),o=hb.onclick;hb.onclick=e=>{if(!window.__x2Down())o&&o(e)}}
 put();(mq.addEventListener?mq.addEventListener('change',put):mq.addListener(put));
 mb.onclick=e=>{e.stopPropagation();window.__x2Up()};
