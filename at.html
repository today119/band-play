<script>
// 새로 그린 악보(alphaTex) — 음표 하나하나에 박자가 들어 있어 커서가 정확히 따라감(10/25 사용자 «너가 악보를 새로 그리는 게 정확하겠다»)

const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);

{const g=k=>{try{return localStorage.getItem('at_'+k)}catch(e){return null}},p=(k,v)=>{try{localStorage.setItem('at_'+k,v)}catch(e){}};

// 아이폰: 무음 스위치가 켜져 있으면 웹오디오(악보 소리)가 안 남 → 오디오 세션을 «재생»으로 바꾸고, 첫 터치에 무음 오디오를 틀어 풀어 줌
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let unl=false;const unlock=()=>{if(unl)return;unl=true;try{const au=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');au.loop=true;au.volume=0.01;au.play().catch(()=>{})}catch(e){}
 try{const c=api&&api.player&&api.player.output&&api.player.output.context;if(c&&c.resume)c.resume()}catch(e){}};
['touchend','click'].forEach(t=>document.addEventListener(t,unlock,{capture:true}));
let api=null;
const DB='https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app/band_play_lib/';
// 같은 곡의 다른 파트(곡_파트 이름)를 골라 보기 — 원곡 기준점은 곡 단위로 공유
const SONG=(q.get('s')||'').split('_')[0],PN={vocal:'🎤 보컬',g1:'🎸 기타1',g2:'🎸 기타2',bass:'🎸 베이스',keys:'🎹 키보드',drums:'🥁 드럼'};

fetch(DB+q.get('k')+'/tex.json?shallow=true').then(r=>r.json()).then(o=>{const all=Object.keys(o||{}),order=Object.keys(PN);
 const songs=[...new Set(all.map(k=>k.split('_')[0]))].sort((a,b)=>(Object.keys(SN).indexOf(a)+99)%99-(Object.keys(SN).indexOf(b)+99)%99);
 $('sg').innerHTML=songs.map(x=>`<option value="${x}"${x===SONG?' selected':''}>${SN[x]||x}</option>`).join('');
 $('sg').onchange=()=>{const x=$('sg').value,want=localStorage.getItem('at_part')||'g1',ks=all.filter(k=>k.split('_')[0]===x);
  q.set('s',ks.includes(x+'_'+want)?x+'_'+want:ks.includes(x+'_g1')?x+'_g1':ks[0]);location.search=q.toString()};
 const ks=all.filter(k=>k.split('_')[0]===SONG);ks.sort((a,b)=>order.indexOf(a.split('_')[1])-order.indexOf(b.split('_')[1]));
 $('pt').innerHTML=ks.map(k=>`<option value="${k}"${k===q.get('s')?' selected':''}>${PN[k.split('_')[1]]||k}</option>`).join('');
 $('pt').onchange=()=>{q.set('s',$('pt').value);location.search=q.toString()}}).catch(()=>{});
const CDN='https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/';
// 원본 밴드 악보처럼 맨 위에 보컬 줄(멜로디+가사)을 같이 보여 줌 — 보컬 소리는 끔(10/25 «각 악보에 노래 가사도»)
const PART=(q.get('s')||'').split('_')[1]||'',STF={g1:'tabs',g2:'score tabs',bass:'score tabs',keys:'score',drums:'score'};
const withVocal=tex=>PART==='vocal'||q.get('lyr')==='0'?Promise.resolve([tex,false]):fetch(DB+q.get('k')+'/tex/'+SONG+'_vocal.json').then(r=>r.json()).then(v=>{
  if(!v)return [tex,false];let part=tex.slice(tex.indexOf('\\track')).replace('\n.\n','\n');
  if(!/\\staff/.test(part.split('\n').slice(0,4).join('\n'))){const nl=part.indexOf('\n');part=part.slice(0,nl+1)+'\\staff {'+(STF[PART]||'score tabs')+'}\n'+part.slice(nl+1)}
  return [tex.slice(0,tex.indexOf('\\track'))+v.slice(v.indexOf('\\track'))+'\n'+part,true]}).catch(()=>[tex,false]);
fetch(DB+q.get('k')+'/tex/'+q.get('s')+'.json').then(r=>r.json()).then(t=>t?withVocal(t):[null,false]).then(([tex,voc])=>{
 if(!tex){$('st').textContent='악보를 못 찾았어요';return}
 const narrow=innerWidth<700;
 api=new alphaTab.AlphaTabApi($('at'),{core:{fontDirectory:CDN+'font/',tex:true},
  display:{staveProfile:voc&&!q.get('v')?'Default':q.get('v')||({vocal:'Score',g1:'Tab',g2:'ScoreTab',bass:'ScoreTab',keys:'Score',drums:'Score'})[(q.get('s')||'').split('_')[1]]||'Tab',scale:narrow?0.95:1.15,layoutMode:'page'},
  notation:{rhythmMode:alphaTab.TabRhythmMode.ShowWithBars},

 window.api=api;let mute=false,sp=1;api.masterVolume=1;$('mt').textContent='🔊 소리';
 api.error.on(e=>{$('st').textContent='오류: '+(e.message||e)});
 api.renderFinished.on(()=>{$('st').textContent='';window.__done=1});
 let ready=false;api.soundFontLoad.on(e=>{if(!ready&&e.total)$('st').textContent='소리 준비 '+Math.floor(e.loaded/e.total*100)+'%'});
 api.playerReady.on(()=>{ready=true;$('st').textContent=''});
 api.playerStateChanged.on(e=>{const on=e.state===1;$('p').textContent=on?'⏸ 멈춤':'▶ 재생';$('p').classList.toggle('on',on)});
 api.tex(tex,voc?[0,1]:undefined);
 if(voc)api.scoreLoaded.on(sc=>{try{api.changeTrackMute([sc.tracks[0]],true)}catch(e){}});
 $('p').onclick=()=>api.playPause();$('h').onclick=()=>api.stop();
 let S=d=>{sp=Math.max(0.5,Math.min(1.5,Math.round((sp+d)*20)/20));api.playbackSpeed=sp;$('sp').textContent=Math.round(sp*100)+'%'};
 $('dn').onclick=()=>S(-0.05);$('up').onclick=()=>S(0.05);
 $('mt').onclick=()=>{mute=!mute;api.masterVolume=mute?0:1;$('mt').textContent=mute?'🔇 소리':'🔊 소리'};


 // ── 합주 방: 같은 방 코드면 누가 ▶를 눌러도 모두 같은 순간에 같은 자리에서 시작(각자 자기 파트 악보). 10/25 «합주하듯이 활용 가능?»
 // band_play/{코드}/at = {on, at(서버 ms 시작 시각), tp(시작 위치 ms), sp(속도), song, by} — 기존 합주 화면(run)과 따로 둠
 const RDB='https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app/band_play/';
 const LG=k=>{try{return JSON.parse(localStorage.getItem('band_play_'+k))}catch(e){return null}},LSet=(k,v)=>{try{localStorage.setItem('band_play_'+k,JSON.stringify(v))}catch(e){}};
 let room=null,es=null,off2=0,run=null,startT=0,drift=0,cid=LG('cid');if(!cid){cid=Math.random().toString(36).slice(2,10);LSet('cid',cid)}
 const sNow=()=>Date.now()+off2;
 async function clockSync(){let best=1e9;for(let k=0;k<4;k++){try{const a=Date.now();const r=await fetch(RDB+room+'/ping/'+cid+'.json',{method:'PUT',body:'{".sv":"timestamp"}'});const v=await r.json(),b=Date.now();if(b-a<best){best=b-a;off2=v-(a+b)/2}}catch(e){}}}
 const put=v=>fetch(RDB+room+'/at.json',{method:'PUT',body:JSON.stringify(v)}).catch(()=>{$('st').textContent='⚠️ 인터넷 연결을 확인해 주세요'});
 const want=()=>run.tp+(sNow()-run.at)*run.sp;
 function apply(){clearTimeout(startT);clearInterval(drift);if(!run)return;
  if(run.song&&run.song!==SONG){$('st').textContent='방에서 다른 곡을 연주 중이에요';return}
  if(!run.on){if(api.playerState===1)api.pause();api.timePosition=run.tp||0;$('st').textContent='';return}
  sp=run.sp||1;api.playbackSpeed=sp;$('sp').textContent=Math.round(sp*100)+'%';
  const d=run.at-sNow();
  if(d>0){if(api.playerState===1)api.pause();api.timePosition=run.tp;$('st').textContent='🎵 함께 시작!';startT=setTimeout(()=>{api.timePosition=want();api.play();$('st').textContent=''},d)}
  else{api.timePosition=want();api.play()}
  // 기기마다 조금씩 밀리는 것 바로잡기(0.12초 넘게 어긋나면 맞춤)
  // 아이패드는 위치 값이 띄엄띄엄 갱신돼서 매번 고치면 오히려 뚝뚝 끊김(10/25) → 마지막 위치 이벤트로 지금 위치를 추정하고, 2번 연속 0.25초 넘게 어긋날 때만 맞춤
  let miss=0;drift=setInterval(()=>{if(!(run&&run.on&&sNow()>run.at+1500&&api.playerState===1&&lastPos))return;
   const now=lastPos.t+(performance.now()-lastPos.at)*(run.sp||1),d=now-want();
   if(Math.abs(d)>250){if(++miss>=2){api.timePosition=want();miss=0;lastPos=null}}else miss=0},1000)}
 let lastPos=null;api.playerPositionChanged.on(e=>{lastPos={t:e.currentTime,at:performance.now()}});
 async function join(c){room=c;LSet('room',c);$('rbox').hidden=true;$('rm').textContent='👥 '+c;$('rm').classList.add('on');await clockSync();
  if(es)es.close();es=new EventSource(RDB+c+'/at.json');es.addEventListener('put',e=>{const m=JSON.parse(e.data);if(m.path==='/')run=m.data;else if(run){run[m.path.slice(1)]=m.data}apply()})}
 function leave(){if(es)es.close();es=null;room=null;run=null;LSet('room',null);clearTimeout(startT);clearInterval(drift);$('rm').textContent='👥 합주 방';$('rm').classList.remove('on')}
 $('rm').onclick=()=>{if(room){leave();return}const b=$('rbox');b.hidden=!b.hidden;if(!b.hidden){$('rcode').value=LG('room')||'';$('rcode').focus()}};
 $('rgo').onclick=()=>{const c=$('rcode').value.trim();if(!/^\d{4}$/.test(c)){$('st').textContent='코드 4자리를 넣어 주세요';return}join(c)};
 const go=(tp,sp2)=>put({on:true,at:Math.round(sNow()+900),tp:Math.max(0,tp),sp:sp2,song:SONG,by:cid});
 $('p').onclick=()=>{if(!room)return api.playPause();if(run&&run.on&&run.song===SONG)put({on:false,tp:Math.round(api.timePosition),song:SONG,by:cid});else go(api.timePosition,sp)};
 $('h').onclick=()=>{if(!room)return api.stop();put({on:false,tp:0,song:SONG,by:cid})};

 $('dn').onclick=()=>S(-0.05);$('up').onclick=()=>S(0.05);

 // ── 원곡(유튜브) 맞춰 틀기: 악보 커서가 영상 시간을 따라감. 기준점(🎯)은 곡마다 이 기기에 저장(10/25 «대표 음원 하나 맞춰 틀어 놓고»)
 const YT_ID=q.get('yt')||({butterfly:'1cMKPc3Yors'})[SONG],MARK=+(q.get('mark')||({butterfly:16,redsunset:7})[SONG]||1),OK='at_off_'+SONG;
 $('mk').textContent=MARK;if(!YT_ID)$('ytb').style.display='none';let yp=null,off=null,sync=0;try{const v=localStorage.getItem(OK)??localStorage.getItem('at_off_'+q.get('s'));if(v!=null)off=+v}catch(e){}
 const barMs=n=>{let t=0;const mb=api.score.masterBars;for(let i=0;i<n-1;i++){const m=mb[i];t+=m.calculateDuration()*60000/960/(api.score.tempo)}return t}; // 앞 마디들 길이(반복 없는 첫 회)
 const info=()=>$('yinfo').textContent=off==null?'원곡을 틀고, 기타가 들어오는 순간 🎯를 누르면 악보가 원곡에 맞춰져요':`맞춤 완료 (영상 ${off.toFixed(2)}초 = 1마디). 영상을 움직이면 악보가 따라가요`;

  api.playbackSpeed=yp.getPlaybackRate();

}).catch(e=>{$('st').textContent='불러오기 실패'});

<script>
// 📷 내 연주 녹화(10/25 «이 앱에 촬영 버튼») — 악보를 보면서 카메라(+마이크)로 찍고, 끝나면 💾 저장(공유 시트 → 사진 앱)
(()=>{const $=id=>document.getElementById(id);let stream=null,rec=null,chunks=[],t0=0,tm=0,file=null,facing='user';
 try{facing=localStorage.getItem('band_play_facing')?JSON.parse(localStorage.getItem('band_play_facing')):'user'}catch(e){}
 const st=t=>{$('st').textContent=t};
 async function cam(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true})}catch(e2){st('카메라를 쓸 수 없어요 — 설정에서 사파리 카메라·마이크 허용을 확인해 주세요');return false}}
  const v=$('vid');v.srcObject=stream;v.classList.toggle('mirror',facing==='user');$('camBox').style.display='block';try{await v.play()}catch(e){}return true}
 function camOff(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').srcObject=null;$('camBox').style.display='none'}
 const type=()=>['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
 async function start(){if(!(await cam()))return;if(!window.MediaRecorder){st('이 기기는 녹화를 지원하지 않아요');return}
  const ty=type();chunks=[];rec=new MediaRecorder(stream,ty?{mimeType:ty,videoBitsPerSecond:6e6}:undefined);
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{const t=rec.mimeType||ty||'video/mp4',d=new Date(),q=new URLSearchParams(location.search),sel=$('pt').selectedOptions[0];
   const nm=((q.get('s')||'합주')+'_'+(sel?sel.textContent.replace(/[^가-힣A-Za-z0-9]/g,''):'')).replace(/[\\/:*?"<>|\s]+/g,'_');
   file=new File(chunks,`${nm}_${d.getMonth()+1}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.${/mp4/.test(t)?'mp4':'webm'}`,{type:t.split(';')[0]});
   rec=null;$('rec').textContent='💾 저장';$('rec').classList.remove('on');$('rec').id='rec';$('rec').dataset.save='1';st('녹화 끝! 💾 저장을 누르면 사진 앱에 넣을 수 있어요')};
  rec.start(1000);t0=Date.now();$('rec').textContent='⏹ 녹화 끝';$('rec').classList.add('on');$('recT').style.display='block';
  clearInterval(tm);tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('recT').textContent=`● ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500)}
 function stop(){if(rec&&rec.state!=='inactive')rec.stop();clearInterval(tm);$('recT').style.display='none'}
 async function save(){if(!file)return;try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name});done();return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();done()}
 function done(){file=null;delete $('rec').dataset.save;$('rec').textContent='⏺ 녹화';st('')}
 $('recT').style.display='none';
 $('rec').onclick=()=>{if($('rec').dataset.save)return save();rec?stop():start()};
 $('camX').onclick=()=>{if(rec){st('녹화 중엔 끌 수 없어요');return}camOff()};
 $('flip').onclick=async()=>{if(rec){st('녹화 중엔 바꿀 수 없어요');return}facing=facing==='user'?'environment':'user';try{localStorage.setItem('band_play_facing',JSON.stringify(facing))}catch(e){}camOff();await cam()};
})();
</script></body></html>
