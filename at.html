 const up=[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}];

 enS.slice(2).forEach((x,i)=>A(x,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-22px)'}],{delay:950+i*50,duration:260}));
 bS.forEach((x,i)=>A(x,[{opacity:0,transform:'translateY(26px) scale(.8)'},{opacity:1,transform:'translateY(-4px) scale(1.06)',offset:.7},{opacity:1,transform:'none'}],{delay:1080+i*60,duration:380}));  // 색종이 없이, 글자만 살짝 튀어 오름(10/26 «Band 는 이전 효과가 더 좋아»)
 const C=['#5EC4BE','#FF3B47','#FFC53D','#fff','#c084fc'];

 emS.forEach((x,i)=>{A(x,[{opacity:0,transform:'translateY(20px) scale(.6)'},{opacity:1,transform:'none'}],{delay:1550+i*90,duration:380});
  x.animate([{transform:'translateY(0) rotate(-6deg)'},{transform:'translateY(-8px) rotate(6deg)'}],{delay:1950+i*90,duration:520,direction:'alternate',iterations:Infinity,easing:'ease-in-out',composite:'add'})});
 // ④ 위리처럼 빨간 띠가 쓸고 지나가며 영문 WeBand 를 닦아내고, 같은 크기의 한글 「위밴드」가 드러남(10/26 «영문 닦아내면서, 크기 맞춰서»)
 setTimeout(()=>{const sr=stg.getBoundingClientRect(),rs=[enS[0],enS[1],...bS].map(x=>x.getBoundingClientRect());
  const L=Math.min(...rs.map(r=>r.left)),R=Math.max(...rs.map(r=>r.right)),T=Math.min(...rs.map(r=>r.top)),B=Math.max(...rs.map(r=>r.bottom));

  ko.style.fontSize=(parseFloat(getComputedStyle(ko).fontSize)*sc)+'px';ko.style.left=((L+R)/2-sr.left)+'px';ko.style.top=((T+B)/2-sr.top)+'px';
  koS.forEach(x=>x.style.opacity=1);
  const W=R-L+40,x0=L-20-sr.left,bar=document.createElement('i');bar.style.cssText=`position:absolute;top:${T-sr.top-12}px;left:${x0}px;width:10px;height:${B-T+24}px;background:#FF3B47;border-radius:3px`;stg.appendChild(bar);
  const d=520,o={duration:d,easing:'cubic-bezier(.45,.05,.35,1)',fill:'forwards'};
  en.style.clipPath='inset(-20% -20% -20% -20%)';
  en.animate([{clipPath:'inset(-20% -20% -20% -20%)'},{clipPath:'inset(-20% -20% -20% 120%)'}],o);
  ko.animate([{clipPath:'inset(-20% 120% -20% -20%)'},{clipPath:'inset(-20% -20% -20% -20%)'}],o);
  bar.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${W}px)`,opacity:1,offset:.95},{transform:`translateX(${W}px)`,opacity:0}],o).onfinish=()=>bar.remove();
  A(em,[{opacity:1},{opacity:.0}],{delay:200,duration:400});
},2500);
 setTimeout(()=>end(),4200)})();

{const g=k=>{try{return localStorage.getItem('at_'+k)}catch(e){return null}},p=(k,v)=>{try{localStorage.setItem('at_'+k,v)}catch(e){}};
