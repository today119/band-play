// 📥 내 요청 진행바(10/29 «앱에서 얼마나 기다려야 하는지 궁금하겠다»)
//   처리 상태 band_play_req_st/{id} — 관리자(감시기·publish_score)가 적고 누구나 읽음
//   got=접수(차례 대기) → work=그리는 중(t=시작) → work+«초안 확인 중»=사람 확인 → done{song,k,p}=열기 / no{msg}
//   예상 시간 = 5분 + 파트 수 + (첨부-1) 분, 최대 20분 (실측: 2파트 1장 4분 · 1파트 1장 5분 · 4파트 PDF4개 6분)
function rqProg(o,x){const est=Math.min(20,5+(x.np||1)+Math.max(0,(x.nf||1)-1))*60000;
 if(!o)return{p:4,t:'📤 보냈어요 · 2분 안에 접수돼요'};
 if(o.st==='got')return x.fix?{p:30,t:'📥 접수됨 · 고쳐서 다시 올려 드릴게요 (보통 하루 안)'}:{p:10,t:'📥 접수됨 · 곧 그리기 시작해요'};
 if(o.st==='work'&&o.msg==='초안 확인 중')return{p:90,t:'👀 초안 완성 · 사람이 마지막으로 확인 중이에요'};
 if(o.st==='work'){const el=Date.now()-(o.t||Date.now()),left=Math.ceil((est-el)/60000);
  return{p:Math.round(12+73*Math.min(1,el/est)),t:'🤖 악보 그리는 중 · '+(left>0?'약 '+left+'분 남음':el<est*2?'거의 다 됐어요':'마무리하는 중')}}
 if(o.st==='done')return{p:100,t:o.auto?'✅ 완료 · 🤖 자동으로 그렸어요 — 틀린 곳은 악보함 «🛠 틀린 곳 알려 주기»':'✅ 완료',done:1};
 if(o.st==='no')return{p:100,t:'⚠️ '+(o.msg||'이 곡은 못 그려요'),no:1};
 return{p:5,t:'접수'}}
function rqRow(x,o){const g=rqProg(o,x),c=g.no?'#d33':g.done?'#1a9d55':'#111';
 const open=g.done&&o.k&&o.song?` <a style="color:#1a9d55;font-weight:700" href="at.html?k=${encodeURIComponent(o.k)}&s=${encodeURIComponent(o.song+'_'+(o.p||'g1'))}">열기</a>`:'';
 return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${esc(x.song)}</b><small style="color:var(--mu)">${esc(x.d)}</small></div>
 <div class="pgl"><div class="prog"><i style="width:${g.p}%;background:${c};transition:width .6s"></i></div><b>${g.p}%</b></div><small style="color:${g.no?'#d33':'var(--mu)'}">${g.t}${open}</small></div>`}

 ${mem.map(([k,v])=>`<div class="row"${mg&&k!==cid?` onclick="memMenu('${k}')" style="cursor:pointer"`:''}><span>${pe(v.part)} <b>${esc(v.name)}</b> <small style="color:var(--mu)">${pn(v.part)}</small>${rTag(k)}${now-(v.t||0)<180000?' <span style="color:#16a34a">●</span>':''}${k===cid?' <span class="tag">나</span>':''}</span><small style="color:var(--mu)">${v.pp?'이번 주 '+mins(wk(k)):''}${mg&&k!==cid?' ⋯':''}</small></div>`).join('')}</div>
 ${ld?setCard():''}
 <div class="card"><h3>📨 멤버 초대</h3><div>초대 코드 <span class="code">${mb.code}</span></div><button class="btn" onclick="invite()">초대 링크 보내기</button></div>
 <div class="card"><h3>나</h3><label class="l">이름</label><input id="mn" maxlength="20" value="${esc(mb.me)}"><label class="l">파트</label>${partSel('mp',mb.part)}
 <label class="chk" style="margin-top:10px"><label><input type="checkbox" id="mpp" ${mb.pp?'checked':''}>내 연습 시간을 밴드에 보여 주기</label></label>
 <button class="btn" id="msv">저장</button><button class="btn gh" style="color:#dc2626" onclick="quit()">밴드 나가기</button></div></main>`);
 $('msv').onclick=()=>{mb.me=$('mn').value.trim()||mb.me;mb.part=$('mp').value;mb.pp=$('mpp').checked;saveBands();LSet('band',mb);try{localStorage.setItem('at_part',mb.part)}catch(e){}
  B.m[cid]={...(B.m[cid]||{}),name:mb.me,part:mb.part,pp:mb.pp,t:Date.now()};hello(mb);toast('저장했어요');render()}}
// 집행부: 가입 승인·거절 · 멤버 메뉴(역할은 밴드장만, 내보내기는 멤버 관리 권한 — 집행부는 밴드장이, 밴드장은 아무도 못 내보냄)
async function okRq(k){const v=B.rq[k];if(!v)return;
 const twin=Object.entries(B.m).find(([j,w])=>w&&nmK(w.name)===nmK(v.name));
 if(twin&&confirm(`이미 «${twin[1].name}»(${pn(twin[1].part)}) 줄이 있어요.\n같은 사람이면 합칠까요? (확인 = 합치기 · 연습 기록·역할 이어받음, 취소 = 따로 멤버)`)){
  const [j]=twin;if(B.ro[j]){await PUT(B.code+'/ro/'+k,B.ro[j]).catch(()=>{});DEL(B.code+'/ro/'+j).catch(()=>{});B.ro[k]=B.ro[j];delete B.ro[j]}
  J(B.code+'/pr/'+j).then(p=>{if(p)J(B.code+'/pr/'+k,{method:'PATCH',body:JSON.stringify(p)})}).catch(()=>{});DEL(B.code+'/m/'+j).catch(()=>{});delete B.m[j]}
 const row={name:v.name,part:v.part,t:{'.sv':'timestamp'}};await PUT(B.code+'/m/'+k,row).catch(()=>{});DEL(B.code+'/rq/'+k).catch(()=>{});
 B.m[k]={...row,t:Date.now()};delete B.rq[k];toast('✅ '+v.name+' 승인했어요');render()}
async function noRq(k){const v=B.rq[k];if(!v||!confirm(`«${v.name}» 가입 신청을 거절할까요?`))return;DEL(B.code+'/rq/'+k).catch(()=>{});delete B.rq[k];render()}
function memMenu(k){const v=B.m[k];if(!v)return;const ld=roleOf(cid)==='lead',r=roleOf(k),kick=can('mem')&&r!=='lead'&&(ld||!r);
 modal(`<h2>${pe(v.part)} ${esc(v.name)}${rTag(k)}</h2><div style="color:var(--mu);margin-bottom:6px">${pn(v.part)}</div>
 ${ld?`<label class="l">역할 — 역할이 있으면 집행부예요</label><div class="chk">${['',...RK.filter(x=>x!=='lead')].map(x=>`<label><input type="radio" name="rr" value="${x}" ${r===x?'checked':''}>${x?RN[x]:'일반 멤버'}</label>`).join('')}<label><input type="radio" name="rr" value="c" ${/^c:/.test(r)?'checked':''}>🏷️ 직접 입력</label></div>
  <input id="rcx" maxlength="10" placeholder="예: 음향감독, 홍보" value="${/^c:/.test(r)?esc(r.slice(2)):''}" style="margin-top:6px" oninput="document.querySelector('input[name=rr][value=c]').checked=true">
  <button class="btn" id="rsv">역할 저장</button><button class="btn b2" onclick="giveLead('${k}')">👑 밴드장 넘기기</button>`:''}
 ${kick?`<button class="btn gh" style="color:#dc2626" onclick="kick('${k}')">밴드에서 내보내기</button>`:''}<button class="btn gh" onclick="closeM()">닫기</button>`);
 if(ld)$('rsv').onclick=()=>{let x=(document.querySelector('input[name=rr]:checked')||{}).value||'';if(x==='c'){const t=$('rcx').value.trim().replace(/[.#$\[\]\/]/g,'');if(!t){toast('직책 이름을 넣어 주세요');return}x='c:'+t}closeM();if(x){B.ro[k]=x;PUT(B.code+'/ro/'+k,x).catch(()=>toast('⚠️ 저장 못 했어요'))}else{delete B.ro[k];DEL(B.code+'/ro/'+k).catch(()=>{})}toast('저장했어요');render()}}
async function giveLead(k){const v=B.m[k];if(!confirm(`«${v.name}»에게 밴드장을 넘길까요?\n나는 부밴드장이 돼요.`))return;closeM();
 B.ro[k]='lead';B.ro[cid]='vice';await PUT(B.code+'/ro/'+k,'lead').catch(()=>{});await PUT(B.code+'/ro/'+cid,'vice').catch(()=>{});toast('👑 밴드장을 넘겼어요');render()}
async function kick(k){const v=B.m[k];if(!confirm(`«${v.name}»을(를) 밴드에서 내보낼까요?\n다시 들어오려면 가입 신청을 해야 해요.`))return;closeM();
 DEL(B.code+'/m/'+k).catch(()=>{});DEL(B.code+'/ro/'+k).catch(()=>{});delete B.m[k];delete B.ro[k];toast('내보냈어요');render()}
async function claimLead(){if(!confirm('이 밴드의 밴드장을 맡을까요?\n역할 지정·가입 승인·권한 설정을 하게 돼요.'))return;
 const ro=await J(B.code+'/ro').catch(()=>null)||{};if(Object.values(ro).includes('lead')){B.ro=ro;toast('이미 밴드장이 생겼어요');render();return}
 await PUT(B.code+'/ro/'+cid,'lead').catch(()=>{});B.ro[cid]='lead';toast('👑 밴드장이 됐어요 — 아래 «밴드 설정»에서 권한을 정하세요');render()}
// ⚙️ 밴드 설정(밴드장만): 가입 승인제 · 일별 권한 · 밴드 이름
function setCard(){const pm=(B.cfg||{}).pm||{};return `<div class="card"><h3>⚙️ 밴드 설정 <small style="font-weight:400">(밴드장만 보여요)</small></h3>
 <label class="l">밴드 이름</label><input id="sbn" maxlength="30" value="${esc(B.band.name)}">
 <label class="chk" style="margin-top:10px"><label><input type="checkbox" id="sap" ${(B.cfg||{}).appr!==false?'checked':''}>가입 승인제 — 초대 링크로 와도 집행부(가입 승인 권한)가 승인해야 들어와요</label></label>
 <h3 style="margin-top:14px">누가 할 수 있나</h3><small style="color:var(--mu)">집행부 = 밴드장·단장·부밴드장·매니저·총무·회계 등 역할을 맡은 사람 전부 · 밴드장은 늘 다 할 수 있어요 (역할은 멤버 이름을 눌러 정해요)</small>
 ${Object.entries(PMN).map(([a,n])=>`<div class="row"><span>${n}</span><select id="pm_${a}" style="width:auto">${Object.entries(LVN).map(([l,t])=>`<option value="${l}"${(pm[a]||PMD[a])===l?' selected':''}>${t}</option>`).join('')}</select></div>`).join('')}
 <button class="btn" onclick="saveSet()">설정 저장</button></div>`}
async function saveSet(){const n=$('sbn').value.trim(),cfg={appr:$('sap').checked,pm:Object.fromEntries(Object.keys(PMN).map(a=>[a,$('pm_'+a).value]))};
 B.cfg=cfg;await PUT(B.code+'/cfg',cfg).catch(()=>toast('⚠️ 저장 못 했어요'));
 if(n&&n!==B.band.name){B.band.name=n;PUT(B.code+'/band/name',n).catch(()=>{});bands.forEach(x=>{if(x.code===B.code)x.name=n});saveBands()}
 toast('설정 저장했어요');render()}
async function invite(){const u=location.origin+location.pathname+'#/join/'+B.code,t=`🎸 «${B.band.name}» 위밴드 초대\n누르고 이름·파트만 넣으면 끝! (초대 코드 ${B.code})\n${u}`;
 try{if(navigator.share){await navigator.share({title:'위밴드 초대',text:t});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t);toast('✅ 복사됨 — 단톡방에 붙여넣기')}catch(e){prompt('복사해서 보내세요',t)}}
function quit(){if(roleOf(cid)==='lead'&&Object.keys(B.m).filter(k=>k!==cid).length){toast('밴드장은 먼저 다른 멤버에게 밴드장을 넘겨 주세요');return}if(!confirm(`«${B.band.name}»에서 나갈까요?`))return;DEL(B.code+'/m/'+cid).catch(()=>{});bands=bands.filter(x=>x.code!==B.code);saveBands();
 const cur=LG('band');if(cur&&cur.code===B.code){LSet('band',null);LSet('jr',null);LSet('mode','solo')}B=null;go('#/')}
function vFee(mb){V(head(mb,'💰 회비')+`<main><div class="card"><h3>2단계에서 열려요</h3><div style="font-size:15px;line-height:1.6">모스처럼 <b>월별 체크판</b>으로 — 누가 몇 월분을 냈는지 한눈에, 총무 혼자서도 관리.</div></div></main>`)}

// 초대 링크(#/join/코드) · 출첵 링크(#/b/코드/cal/날짜)를 가입 전에 열면 가입 후 그 자리로
{const h=location.hash,m=h.match(/^#\/b\/(\d{4})\//);if(m&&!myBand(m[1])){try{sessionStorage.setItem('wb_after',h)}catch(e){}location.hash='#/join/'+m[1]}}
// 처음 열 때: 밴드가 하나뿐이고 주소가 비었으면 바로 그 밴드 홈
if(!location.hash||location.hash==='#')location.hash=bands.length===1?'#/b/'+bands[0].code+'/home':'#/';
render();
// 다른 멤버가 바꾼 것(출첵·일정) 반영: 화면 돌아올 때·30초마다
const refresh=async()=>{if(!B||document.hidden||$('mod'))return;const c=B.code;if(await load(c))render()};
document.addEventListener('visibilitychange',refresh);setInterval(refresh,30000);
// 옆으로 밀어 밴드 메뉴 넘기기(10/26 «상단 메뉴는 누르기 쉽지 않으니 스와이프로»): 가로로 70px 넘게·세로보다 2배 넘게 밀었을 때만.
// 화면 가장자리 24px(아이폰 뒤로 가기 제스처)·입력칸·창(일정 만들기 등)은 제외, 달력 위에서 밀면 달 넘기기
{let x0=null,y0=0,t0=0,on=null;
 document.addEventListener('touchstart',e=>{const t=e.touches[0];x0=null;if(e.touches.length>1||$('mod')||!B||!location.hash.startsWith('#/b/'))return;
  if(t.clientX<24||t.clientX>innerWidth-24||e.target.closest('input,select,textarea'))return;x0=t.clientX;y0=t.clientY;t0=Date.now();on=e.target.closest('#calc')},{passive:true});
 document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2||Date.now()-t0>700)return;const dir=dx<0?1:-1;
  if(on){const [y,m]=calM.split('-').map(Number);calM=ymd(new Date(y,m-1+dir,1)).slice(0,7);render();return}
  const i=BT.findIndex(x=>x[0]===bTab),j=i+dir;if(j<0||j>=BT.length)return;
  go('#/b/'+B.code+'/'+BT[j][0])},{passive:true})}
</script></body></html>
