<style>

.todo{margin-top:12px;border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.06);border-radius:6px;padding:8px 12px}.todo div{padding:4px 0;font-size:13px;display:flex;gap:8px}.todo .lv{font-family:var(--mono);font-size:11px;font-weight:700;width:34px;flex:none;padding-top:2px}

details.tg{margin-top:10px;border:1px solid var(--li2);border-radius:6px;background:#2a2f39}details.tg summary{cursor:pointer;padding:11px 12px;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.tg summary::-webkit-details-marker{display:none}details.tg summary:after{content:'+';font-family:var(--mono);color:var(--mu)}details.tg[open] summary:after{content:'−'}details.tg .in{padding:0 12px 12px;font-size:13px}
.sl{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.sl div{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mu)}
.up{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--li);align-items:flex-start}.up b{white-space:nowrap;font-family:var(--mono)}.up .d{color:var(--mu2);white-space:nowrap;margin-left:auto;font-family:var(--mono);font-size:12px}
.key{border:1px dashed var(--li2);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--mu);line-height:1.6}
.bd{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}.bd.r{background:rgba(239,68,68,.15);color:var(--bad)}.bd.y{background:rgba(245,158,11,.15);color:var(--warn)}
.login{text-align:center;padding:70px 20px;color:var(--mu)}.login button{margin-top:14px;background:var(--tx);color:var(--bg);border:0;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600}
.empty{color:var(--mu);text-align:center;padding:30px}
.back{display:none;background:none;border:1px solid var(--li2);color:var(--tx);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.bgs{display:inline-flex;gap:6px;flex-wrap:wrap}
/* 폰·태블릿(10/30 사용자 «폰에서는 박스 2×3, 누르면 상세로 들어가게») */
@media(max-width:1199px){.grid{grid-template-columns:repeat(2,1fr)!important}body:not(.dv) .ra{display:none}body.dv .la,body.dv .bar,body.dv .foot{display:none}.back{display:inline-block}body.dv .ra .sec{display:none}.pane{margin-top:0}}
@media(max-width:599px){.grid{gap:8px}.box{padding:10px}.bh{gap:6px}.bh img{width:24px;height:24px;border-radius:6px}.bh .bn{font-size:14px;flex:1}.bgs{width:100%;gap:4px}
 .st{font-size:10px;padding:1px 4px;gap:3px}.st svg{width:10px;height:10px}.bk{gap:12px;margin:10px 0 8px}.bk b{font-size:18px}.bk small{font-size:10px}.bf{gap:8px;font-size:11px;padding-top:6px}
 .box .stl{display:none}.box .sts{display:inline}.who .em{display:none}}
.sts{display:none}code{font-family:var(--mono);font-size:12px;color:var(--tx)}
</style></head><body>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 앱 통합 현황판(10/29 사용자 «매번 ASC·플레이 콘솔 안 들어가도 다운로드·요청·버그·이용 현황을 다각도로»)
//   ~/tools/app-ops/collect.py 가 매일 아침(launchd) ops_stats/latest·hist 에 씀 → 관리자(band_play_admin)만 읽기
//   10/30 디자인: 소프트웨어 콘솔 느낌(어두운 바탕) · 실제 스토어 로고 · 앱 박스 = 정보+선택(별점·리뷰·할 일 표시)
//   ?mock=1 → 가짜 자료로 화면만
const FBC={apiKey:'AIzaSyBWAAeuN_bwwrY2R1NupXLwT4ECPhyivo0',authDomain:'matchmaker-28187.firebaseapp.com',projectId:'matchmaker-28187',appId:'1:640935869730:web:893abadb93ae3e949df97b',databaseURL:'https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app'};
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dt=t=>{if(!t)return'-';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const ago=t=>{if(!t)return'-';const m=(Date.now()-t)/60000;return m<60?Math.round(m)+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'};
const SP={tennis:'테니스',volleyball:'배구',badminton:'배드민턴',basketball:'농구',soccer:'축구',futsal:'풋살',baseball:'야구',tabletennis:'탁구',pickleball:'피클볼',handball:'핸드볼'};
const LINK={weband:['admin.html','악보 요청 열기']};
const SL={live:'출시',review:'심사 중',test:'테스트',plan:'등록 예정',web:'웹 전용'};
const HEAD={club:['가입','7일 접속'],wereplay:['경기 기록','7일'],weband:['밴드','7일 활동 밴드'],mmpro:['대회','세션'],baseball:['경기','7일 경기'],volleyball:['경기','7일 경기']};
// 스토어 로고(애플 = 사과, 구글 플레이 = 4색 삼각형), 웹 = 지구
const LOGO={ios:'<svg viewBox="0 0 24 24"><path d="M16.37 1.43c0 1.14-.49 2.27-1.18 3.08-.74.9-1.99 1.57-2.99 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.57-2.27 1.21-2.98.8-.94 2.14-1.64 3.25-1.68.03.13.05.28.05.43zm4.56 15.71c-.03.07-.46 1.58-1.52 3.12-.94 1.34-1.94 2.71-3.43 2.71-1.52 0-1.9-.88-3.63-.88-1.7 0-2.3.91-3.67.91-1.38 0-2.33-1.26-3.43-2.8C4 18.38 2.96 15.57 2.96 12.92c0-4.28 2.8-6.55 5.55-6.55 1.45 0 2.68.95 3.6.95.87 0 2.22-1.01 3.9-1.01.61 0 2.89.06 4.37 2.19-.13.09-2.38 1.37-2.38 4.19 0 3.26 2.85 4.42 2.96 4.45z"/></svg>',
 android:'<svg class="gp" viewBox="0 0 24 24"><path fill="#00d7fe" d="M3.6 2.2 13.4 12l-9.8 9.8c-.4-.2-.6-.6-.6-1.1V3.3c0-.5.2-.9.6-1.1z"/><path fill="#ffce00" d="m16.7 15.3-3.3-3.3 3.3-3.3 3.7 2.1c1 .6 1 1.8 0 2.4z"/><path fill="#ff3a44" d="M13.4 12l-9.8 9.8c.4.2.9.2 1.4-.1l11.7-6.4z"/><path fill="#00f076" d="M13.4 12l3.3-3.3L5 2.3c-.5-.3-1-.3-1.4-.1z"/></svg>',
 web:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.3 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4z"/></svg>'};
let L=null,HI={};const OPEN=new Set();
// 폰: #앱키 = 상세 화면(뒤로 가기로 목록), 큰 화면은 나란히라 무시
let LY=0;function route(){const k=decodeURIComponent(location.hash.slice(1));const on=!!k&&innerWidth<1200;if(on&&!document.body.classList.contains('dv'))LY=scrollY;
 if(k)TAB=k;document.body.classList.toggle('dv',on);draw();scrollTo(0,on?0:LY)}
addEventListener('hashchange',route);
let TAB=(()=>{try{return localStorage.getItem('ops_tab')}catch(e){return null}})();
if(location.hash.length>1){TAB=decodeURIComponent(location.hash.slice(1));if(innerWidth<1200)document.body.classList.add('dv')}
// 7일 전 기록과 비교한 증감(쌓인 기록이 있을 때만)
function diff(app,name,v){const ds=Object.keys(HI).sort(),old=ds.find(d=>d>=new Date(Date.now()-7*864e5).toISOString().slice(0,10));
 const o=old&&HI[old][app]&&HI[old][app][name];if(o==null||o===v||ds.indexOf(old)===ds.length-1)return'';const x=v-o;return `<i class="${x>0?'u':'d'}">${x>0?'+':''}${x}</i>`}
const kv=(a,n)=>{const x=(a.kpi||[]).find(k=>k[0]===n);return x?x[1]:'-'};
const SS={live:'출시',review:'심사',test:'테스트',plan:'예정',web:'웹'};
function stb(kind,x){if(!x)return'';const st=x[0];return `<span class="st ${st}" title="${esc(x[1])}">${LOGO[st==='web'?'web':kind]}<span class="stl">${esc(SL[st]||st)}</span><span class="sts">${esc(SS[st]||st)}</span></span>`}
// 스토어 별점·리뷰(열쇠 연결 후 store.byApp[k] = {rating, count, fresh, low})
const SB=(s,k)=>(s.byApp||{})[k]||null;
// 앱별 할 일: hi 빨강 · md 주황 · lo 회색
function todo(k,a,s){const o=[],r=a.req,b=SB(s,k);
 if(r){if(r.fixOpen)o.push(['hi',`🛠 고쳐 주세요 ${r.fixOpen}건 대기`]);if(r.no)o.push(['hi',`악보 자동 실패 ${r.no}건 — 직접 확인`]);if(r.open)o.push(['md',`악보 요청 진행 중 ${r.open}건`])}
 if(b&&b.low)o.push(['hi',`별 3개 이하 새 리뷰 ${b.low}건`]);if(b&&b.fresh)o.push(['md',`새 리뷰 ${b.fresh}건 — 답변하기`]);
 for(const [kind,nm] of [['ios','앱스토어'],['android','구글 플레이']]){const x=a[kind];if(x&&x[0]==='review')o.push(['lo',`${nm} 심사 결과 기다리는 중 — ${x[1]}`])}
 (a.updates||[]).filter(u=>u[2]==='review'&&!o.some(t=>t[1].includes(u[0]))).forEach(u=>o.push(['lo',`${u[0]} 심사 중 (${u[1]} 제출)`]));
 return o}
function box(k,a,s){const hd=HEAD[k]||[],b=SB(s,k),t=todo(k,a,s),hi=t.filter(x=>x[0]!=='lo').length,store=/^(live|review|test)$/.test(a.st);
 const ft=[];if(store)ft.push(b&&b.rating?`<span class="s">★<b>${(+b.rating).toFixed(1)}</b></span><span>리뷰<b>${b.count||0}</b></span>`:'<span>★ —</span>');
 if(b&&b.fresh)ft.push(`<span class="r">새 리뷰<b>${b.fresh}</b></span>`);ft.push(hi?`<span class="t">할 일<b>${hi}</b></span>`:`<span>할 일<b>0</b></span>`);
 return `<button class="box ${k===TAB?'on':''}" data-k="${k}"><div class="bh"><img src="ops-ic/${k}.png" alt=""><span class="bn">${esc(a.name)}</span><span class="bgs">${stb('ios',a.ios)}${stb('android',a.android)}</span></div>
 <div class="bk">${hd.map(n=>`<span><b>${kv(a,n)}</b><small>${esc(n)}</small></span>`).join('')}</div><div class="bf">${ft.join('')}</div></button>`}
function detail(k,a,s){const lk=LINK[k],t=todo(k,a,s);
 let h=`<div class="pane" id="dt"><button class="back" id="bk">‹ 앱 목록</button><div class="ph"><img src="ops-ic/${k}.png" alt=""><h2>${esc(a.full||a.name)}</h2>${stb('ios',a.ios)}${stb('android',a.android)}<span class="sp"></span>${lk?`<a href="${lk[0]}">${lk[1]} ↗</a>`:''}</div>`;
 h+=`<div class="kpi">${(a.kpi||[]).map(([n,v])=>`<div><b>${v}${diff(k,n,v)}</b><span>${esc(n)}</span></div>`).join('')}</div>`;
 if(t.length)h+=`<div class="todo">${t.map(([lv,x])=>`<div><span class="lv ${lv}">${{hi:'TODO',md:'WAIT',lo:'INFO'}[lv]}</span><span>${esc(x)}</span></div>`).join('')}</div>`;
 if(a.req){const r=a.req;h+=`<div class="sub">악보 요청 — 전체 <b>${r.total}</b> · 이번 주 <b>${r.week}</b> · 진행 중 <b>${r.open}</b> · 자동 올림 <b>${r.auto}</b> · 실패 <b>${r.no}</b> · 고쳐 주세요 <b>${r.fix}</b></div>`}
